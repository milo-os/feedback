# Stands in for Milo's audit log processor (vector-audit-log-processor in
# milo-system, where test-infra's Milo sends audit events and which
# test-infra doesn't deploy). It answers 200 and writes each batch of events
# to its log, one JSON line per batch, so the e2e tests can check what Milo
# audits. Applied by hack/e2e/deploy.sh, outside this kustomization because
# it lives in milo-system.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-audit-log-processor
  namespace: milo-system
data:
  handle.sh: |
    #!/bin/sh
    # One HTTP request on stdin: log the body to stderr, answer 200.
    len=0
    while IFS= read -r line; do
      line=$(printf '%s' "$line" | tr -d '\r')
      [ -z "$line" ] && break
      case $line in [Cc]ontent-[Ll]ength:*) len=${line#*: } ;; esac
    done
    if [ "$len" -gt 0 ]; then head -c "$len" | tr -d '\n' >&2; echo >&2; fi
    printf 'HTTP/1.1 200 OK\r\nContent-Length: 0\r\nConnection: close\r\n\r\n'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-audit-log-processor
  namespace: milo-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vector-audit-log-processor
  template:
    metadata:
      labels:
        app: vector-audit-log-processor
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: sink
          image: curlimages/curl:8.11.1
          command: [nc, -lk, -p, "8081", -e, /sink/handle.sh]
          ports:
            - {name: http, containerPort: 8081}
          volumeMounts:
            - {name: sink, mountPath: /sink}
      volumes:
        - name: sink
          configMap:
            name: vector-audit-log-processor
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: vector-audit-log-processor
  namespace: milo-system
spec:
  selector:
    app: vector-audit-log-processor
  ports:
    - {name: http, port: 8081, targetPort: http}
