# Kubeconfigs for the operator and feedback-uploads to reach the Milo in this
# cluster. The tokens are test values that hack/e2e/milo-identities.sh adds to
# Milo's token file for the services' production usernames. milo-ca is copied
# from Milo by hack/e2e/deploy.sh.
apiVersion: v1
kind: Secret
metadata:
  name: feedback-operator-milo-kubeconfig
stringData:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: milo
        cluster:
          server: https://milo-apiserver.milo-system.svc.cluster.local:6443
          certificate-authority: /etc/kubernetes/pki/trust/ca.crt
    users:
      - name: feedback-operator
        user:
          token: e2e-feedback-operator-token
    contexts:
      - name: milo
        context: {cluster: milo, user: feedback-operator}
    current-context: milo
---
apiVersion: v1
kind: Secret
metadata:
  name: feedback-uploads-milo-kubeconfig
stringData:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: milo
        cluster:
          server: https://milo-apiserver.milo-system.svc.cluster.local:6443
          certificate-authority: /etc/kubernetes/pki/trust/ca.crt
    users:
      - name: feedback-uploads
        user:
          token: e2e-feedback-uploads-token
    contexts:
      - name: milo
        context: {cluster: milo, user: feedback-uploads}
    current-context: milo
