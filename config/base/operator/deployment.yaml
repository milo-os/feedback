apiVersion: apps/v1
kind: Deployment
metadata:
  name: feedback-operator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: feedback-operator
  template:
    metadata:
      labels:
        app: feedback-operator
    spec:
      serviceAccountName: feedback-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: operator
        image: ghcr.io/milo-os/feedback:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          capabilities:
            drop:
            - ALL
        command:
        - /feedback
        - operator
        args:
        # The milo-integration component mounts this kubeconfig.
        - --milo-kubeconfig=/etc/kubernetes/milo/kubeconfig
        - --leader-elect
        - --leader-election-namespace=$(POD_NAMESPACE)
        - --webhook-cert-dir=/etc/kubernetes/pki/webhook
        - --attachments-bucket=$(ATTACHMENTS_BUCKET)
        - --zap-encoder=json
        env:
        - name: ATTACHMENTS_BUCKET
          valueFrom:
            configMapKeyRef:
              name: feedback-config
              key: attachments-bucket
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - containerPort: 9443
          name: webhook
          protocol: TCP
        - containerPort: 8080
          name: metrics
          protocol: TCP
        - containerPort: 8081
          name: probes
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: probes
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: probes
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: webhook-cert
          mountPath: /etc/kubernetes/pki/webhook
          readOnly: true
      volumes:
      # Replaced by the milo-integration component with a certificate Milo
      # trusts.
      - name: webhook-cert
        secret:
          secretName: feedback-operator-webhook-cert
          optional: true
