# Leader election happens in the cluster feedback-sync runs in. Everything
# else it does is in Milo, with its Milo identity.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: feedback-sync-leader-election
rules:
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: feedback-sync-leader-election
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: feedback-sync-leader-election
subjects:
- kind: ServiceAccount
  name: feedback-sync
