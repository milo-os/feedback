---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
    discovery.miloapis.com/parent-contexts: Platform;User
  name: releases.feedback.miloapis.com
spec:
  group: feedback.miloapis.com
  names:
    kind: Release
    listKind: ReleaseList
    plural: releases
    singular: release
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.title
      name: Title
      type: string
    - jsonPath: .status.dueOn
      name: Due
      type: string
    - jsonPath: .status.shipped
      name: Shipped
      type: boolean
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Release maps to a milestone in the FeedbackSource's milestones repository.
          Only feedback-sync writes releases; everyone can read them.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          status:
            description: ReleaseStatus is synced from the milestone.
            properties:
              codename:
                type: string
              coverImage:
                description: CoverImage is a key into the website's static assets.
                type: string
              descriptionHTML:
                type: string
              dueOn:
                description: DueOn is the milestone due date, as YYYY-MM-DD.
                type: string
              github:
                description: GitHubLink identifies a GitHub issue, milestone or discussion.
                properties:
                  number:
                    description: Number is the issue, milestone or discussion number.
                    format: int32
                    type: integer
                  url:
                    description: URL is the HTML URL on github.com.
                    type: string
                required:
                - number
                - url
                type: object
              posts:
                description: Posts are the names of posts on the milestone.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              shipped:
                description: Shipped is set when the milestone is closed.
                type: boolean
              title:
                description: 'Title is the milestone title, e.g. "Hedy: 2.0".'
                type: string
              version:
                type: string
            required:
            - title
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
