---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
    discovery.miloapis.com/parent-contexts: Platform;User
    iam.miloapis.com/owner-field: spec.userRef.name
  name: votes.feedback.miloapis.com
spec:
  group: feedback.miloapis.com
  names:
    kind: Vote
    listKind: VoteList
    plural: votes
    singular: vote
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.postRef.name
      name: Post
      type: string
    - jsonPath: .spec.userRef.name
      name: User
      priority: 1
      type: string
    - jsonPath: .spec.source
      name: Source
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Vote is a user's vote on a post. Users create and delete their own in the
          user context; staff list every vote in the platform context.

          Every user's votes share one collection, so the name is
          "<post>.<user>" (see OwnedName), which allows one vote per user per post.
          The admission webhook sets spec.userRef from the request. The operator
          follows the post for the voter and recomputes the post's totals.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: VoteSpec identifies the post and where the vote came from.
            properties:
              postRef:
                description: PostReference names a Post.
                properties:
                  name:
                    description: Name of the Post, e.g. datum-cloud.enhancements.912.
                    maxLength: 200
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              source:
                description: Source is the client the vote was cast from.
                enum:
                - website
                - portal
                - datumctl
                - patch
                - email
                - github
                type: string
              userRef:
                description: UserRef is the voter, set by the admission webhook.
                properties:
                  name:
                    maxLength: 63
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - postRef
            - userRef
            type: object
            x-kubernetes-validations:
            - message: spec is immutable; delete the vote and vote again
              rule: self == oldSelf
          status:
            description: VoteStatus is written by the operator.
            properties:
              githubLogin:
                description: "GitHubLogin is the GitHub username linked to the voter's
                  account when\nthey voted, so a \U0001F44D from the same person isn't
                  counted twice. Never\npublic."
                type: string
              organizations:
                description: |-
                  Organizations the voter belonged to when voting. Used for staff
                  analytics and never public.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              subscribed:
                description: |-
                  Subscribed is set once the operator has followed the post for the
                  voter, so a follow the voter later deletes isn't recreated.
                type: boolean
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: metadata.name must be <spec.postRef.name>.<spec.userRef.name>
          rule: self.metadata.name == self.spec.postRef.name + '.' + self.spec.userRef.name
    selectableFields:
    - jsonPath: .spec.userRef.name
    - jsonPath: .spec.postRef.name
    served: true
    storage: true
    subresources:
      status: {}
