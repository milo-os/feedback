---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
    discovery.miloapis.com/parent-contexts: Platform
  name: feedbacksources.feedback.miloapis.com
spec:
  group: feedback.miloapis.com
  names:
    kind: FeedbackSource
    listKind: FeedbackSourceList
    plural: feedbacksources
    singular: feedbacksource
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.github.org
      name: Org
      type: string
    - jsonPath: .status.lastReconcile.completedAt
      name: Last reconcile
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          FeedbackSource configures what the feedback service syncs from one GitHub
          organization and how GitHub fields map onto posts. There is one per org.

          FeedbackSource is a Platform resource stored in etcd.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FeedbackSourceSpec defines what to sync and how to map it.
            properties:
              categoryMapping:
                additionalProperties:
                  type: string
                description: CategoryMapping maps GitHub label names to post categories.
                type: object
              github:
                description: GitHub configures the GitHub organization this source
                  syncs.
                properties:
                  changelog:
                    description: |-
                      Changelog configures the discussion category that becomes changelog
                      entries.
                    properties:
                      discussionCategory:
                        type: string
                      repository:
                        type: string
                    required:
                    - discussionCategory
                    - repository
                    type: object
                  installationID:
                    description: InstallationID is the GitHub App installation ID
                      for Org.
                    format: int64
                    type: integer
                  issues:
                    description: |-
                      Issues selects which issues become posts. An issue is included when it
                      matches any issue type or label, and is not excluded.
                    properties:
                      excludeLabels:
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: set
                      issueTypes:
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: set
                      labels:
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: set
                    type: object
                  milestones:
                    description: Milestones configures the repository whose milestones
                      become releases.
                    properties:
                      repository:
                        type: string
                    required:
                    - repository
                    type: object
                  org:
                    description: Org is the GitHub organization login.
                    type: string
                  project:
                    description: |-
                      Project is the GitHub project that provides status and receives vote
                      totals.
                    properties:
                      number:
                        description: Number is the project number.
                        format: int32
                        type: integer
                      owner:
                        description: Owner is the org that owns the project.
                        type: string
                      statusField:
                        description: StatusField is the single-select field that holds
                          item status.
                        type: string
                      votesField:
                        description: VotesField is the number field the service writes
                          vote totals to.
                        type: string
                    required:
                    - number
                    - owner
                    type: object
                  repositories:
                    description: |-
                      Repositories selects which public repositories are synced. Private
                      repositories are always skipped.
                    properties:
                      exclude:
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: set
                      include:
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: set
                    type: object
                required:
                - installationID
                - org
                type: object
              statusMapping:
                additionalProperties:
                  description: |-
                    PostState is the public status of a post, derived from the Enhancements
                    project's Status field and the issue state.
                  enum:
                  - none
                  - backlog
                  - planning
                  - on-deck
                  - in-progress
                  - shipped
                  - closed
                  type: string
                description: |-
                  StatusMapping maps Enhancements project Status option names to post
                  statuses. The empty key matches items with no Status set.
                type: object
            required:
            - github
            type: object
          status:
            description: FeedbackSourceStatus reports sync health for the source.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastReconcile:
                description: LastReconcile describes the last completed reconcile.
                properties:
                  completedAt:
                    format: date-time
                    type: string
                  postsSynced:
                    format: int32
                    type: integer
                required:
                - completedAt
                type: object
              lastWebhookAt:
                description: LastWebhookAt is when the last webhook for this source
                  was processed.
                format: date-time
                type: string
              rateLimit:
                description: RateLimit is the GitHub rate limit for this installation.
                properties:
                  remaining:
                    format: int32
                    type: integer
                  resetAt:
                    format: date-time
                    type: string
                required:
                - remaining
                - resetAt
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
