---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
    discovery.miloapis.com/parent-contexts: Platform;User
  name: changelogentries.feedback.miloapis.com
spec:
  group: feedback.miloapis.com
  names:
    kind: ChangelogEntry
    listKind: ChangelogEntryList
    plural: changelogentries
    singular: changelogentry
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.title
      name: Title
      type: string
    - jsonPath: .status.publishedAt
      name: Published
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ChangelogEntry maps to a discussion in the FeedbackSource's changelog
          category. Only feedback-sync writes entries; everyone can read them.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          status:
            description: ChangelogEntryStatus is synced from the discussion.
            properties:
              bodyHTML:
                description: BodyHTML is the discussion body, sanitised like post
                  bodies.
                type: string
              categories:
                description: Categories are mapped from discussion labels.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              github:
                description: GitHubLink identifies a GitHub issue, milestone or discussion.
                properties:
                  number:
                    description: Number is the issue, milestone or discussion number.
                    format: int32
                    type: integer
                  url:
                    description: URL is the HTML URL on github.com.
                    type: string
                required:
                - number
                - url
                type: object
              issueRefs:
                description: |-
                  IssueRefs are every issue referenced in the body, as
                  "<org>/<repo>#<number>". A reference to a post's work item rather than
                  the post marks that post part-shipped.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              posts:
                description: Posts are the names of posts referenced in the body.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              publishedAt:
                format: date-time
                type: string
              reactions:
                description: ChangelogReactions are reaction counts on the discussion.
                properties:
                  thumbsUp:
                    format: int32
                    type: integer
                type: object
              title:
                type: string
            required:
            - publishedAt
            - title
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
