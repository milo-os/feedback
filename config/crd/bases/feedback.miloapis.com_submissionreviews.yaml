---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
    discovery.miloapis.com/parent-contexts: Platform
  name: submissionreviews.feedback.miloapis.com
spec:
  group: feedback.miloapis.com
  names:
    kind: SubmissionReview
    listKind: SubmissionReviewList
    plural: submissionreviews
    singular: submissionreview
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.decision
      name: Decision
      type: string
    - jsonPath: .spec.reviewer
      name: Reviewer
      type: string
    - jsonPath: .status.applied
      name: Applied
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SubmissionReview is the staff side of a Submission, with the same name. The
          operator creates it when the submission arrives and writes triage to its
          status. Staff decide by setting spec.decision, which can't change once set;
          the operator then applies the decision. Submitters can't read it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SubmissionReviewSpec is the staff decision. Empty until staff
              decide.
            properties:
              affected:
                description: Affected sets spec.affected on the SecurityReport for
                  MoveToSecurity.
                maxLength: 200
                type: string
              decision:
                description: ReviewDecision is a staff decision on a submission.
                enum:
                - Approved
                - Merged
                - Rejected
                - MoveToSecurity
                type: string
              mergedInto:
                description: MergedInto is the post name when the decision is Merged.
                maxLength: 200
                type: string
              publicBody:
                maxLength: 20000
                type: string
              publicTitle:
                description: |-
                  PublicTitle and PublicBody are what goes to GitHub on approval. Clients
                  default them to the triage draft.
                maxLength: 200
                type: string
              reason:
                description: Reason is shown to the submitter when the decision is
                  Rejected.
                maxLength: 2000
                type: string
              reviewedAt:
                description: ReviewedAt is when the decision was set, by the admission
                  webhook.
                format: date-time
                type: string
              reviewer:
                description: |-
                  Reviewer is the staff member who set the decision. The admission
                  webhook sets it from the request; it can't be set by clients.
                type: string
            type: object
            x-kubernetes-validations:
            - message: a decision can't change once it is set
              rule: '!has(oldSelf.decision) || self == oldSelf'
            - message: Approved needs publicTitle and publicBody
              rule: '!has(self.decision) || self.decision != ''Approved'' || (has(self.publicTitle)
                && has(self.publicBody))'
            - message: Merged needs mergedInto
              rule: '!has(self.decision) || self.decision != ''Merged'' || has(self.mergedInto)'
            - message: Rejected needs a reason for the submitter
              rule: '!has(self.decision) || self.decision != ''Rejected'' || has(self.reason)'
          status:
            description: SubmissionReviewStatus is written by the operator.
            properties:
              applied:
                description: Applied is set once the operator has carried out the
                  decision.
                type: boolean
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              triage:
                description: Triage is advisory.
                properties:
                  draftIssue:
                    description: DraftIssue is a public title and body with private
                      details stripped.
                    properties:
                      body:
                        type: string
                      title:
                        type: string
                    required:
                    - body
                    - title
                    type: object
                  fraudScore:
                    description: FraudScore is from the fraud service, 0 to 1, as
                      a decimal string.
                    type: string
                  likelySecurityIssue:
                    description: |-
                      LikelySecurityIssue flags submissions that should be moved to the
                      security track.
                    type: boolean
                  similarPosts:
                    description: SimilarPosts come from a keyword search on the submission.
                    items:
                      description: SimilarPost is a post that may cover the same feedback.
                      properties:
                        name:
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  suggestedCategories:
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  suggestedKind:
                    description: SubmissionKind is what the submitter says the feedback
                      is.
                    enum:
                    - idea
                    - bug
                    - other
                    type: string
                type: object
            type: object
        type: object
    selectableFields:
    - jsonPath: .spec.decision
    served: true
    storage: true
    subresources:
      status: {}
