---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
    discovery.miloapis.com/parent-contexts: Platform;User
    iam.miloapis.com/owner-field: spec.userRef.name
  name: feedbackprofiles.feedback.miloapis.com
spec:
  group: feedback.miloapis.com
  names:
    kind: FeedbackProfile
    listKind: FeedbackProfileList
    plural: feedbackprofiles
    singular: feedbackprofile
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.showPublicVotes
      name: Public votes
      type: boolean
    - jsonPath: .spec.digestEmails
      name: Emails
      type: boolean
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          FeedbackProfile holds a user's feedback settings. Users create and update
          their own in the user context; it is named after the user.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: FeedbackProfileSpec is the user's settings.
            properties:
              digestEmails:
                description: DigestEmails turns the daily digest on or off. Unset
                  means on.
                type: boolean
              showPublicVotes:
                description: |-
                  ShowPublicVotes shows the user's avatar and name on posts they voted
                  on, including past votes.
                type: boolean
              userRef:
                description: UserRef is the user, set by the admission webhook.
                properties:
                  name:
                    maxLength: 63
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: userRef is immutable
                  rule: self == oldSelf
            required:
            - userRef
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: metadata.name must be the user's name
          rule: self.metadata.name == self.spec.userRef.name
    selectableFields:
    - jsonPath: .spec.userRef.name
    served: true
    storage: true
    subresources: {}
