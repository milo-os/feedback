# feedback-operator reconciles every feedback resource: it watches them all,
# writes post votes and delivery, follows and votes it creates for users,
# review outcomes, reports moved from submissions, acknowledgements and
# digests. It never writes a post's GitHub fields or a user's spec.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: feedback.miloapis.com:operator
rules:
  - apiGroups: [feedback.miloapis.com]
    resources: [feedbacksources, posts, releases, changelogentries, votes, subscriptions, submissions, submissionreviews, securityreports, securityreporttriages, securityacknowledgements, feedbackprofiles, feedbackdigests]
    verbs: [get, list, watch]
  - apiGroups: [feedback.miloapis.com]
    resources: [posts/hidden]
    verbs: [get]
  - apiGroups: [feedback.miloapis.com]
    resources: [posts/status, votes/status, submissions/status, submissionreviews/status, securityreports/status]
    verbs: [get, update, patch]
  - apiGroups: [feedback.miloapis.com]
    resources: [votes, subscriptions, submissionreviews, securityreports, securityacknowledgements, feedbackdigests]
    verbs: [create, update, patch, delete]
  # delete for reports moved to the security track; update and patch only to
  # add and remove the attachments finalizer.
  - apiGroups: [feedback.miloapis.com]
    resources: [submissions]
    verbs: [update, patch, delete]
  # Voters' organizations and linked GitHub usernames, for staff analytics
  # and so a 👍 from the same person isn't counted twice.
  - apiGroups: [resourcemanager.miloapis.com]
    resources: [organizationmemberships]
    verbs: [list]
  - apiGroups: [identity.miloapis.com]
    resources: [useridentities]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: feedback.miloapis.com:operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: feedback.miloapis.com:operator
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: system:feedback-operator@feedback.miloapis.com
