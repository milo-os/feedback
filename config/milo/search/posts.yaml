# Posts are found by their GitHub text, categories, labels and state. The
# indexer keeps the whole object, but only these fields are searchable;
# votes, trendingScore and delivery change as side effects and would go
# stale, so they aren't. Hidden posts are left out, and hiding a post
# removes it from the index.
#
# The indexer binds metadata, spec and status only when the object has
# them, and a condition that can't be evaluated counts as no match. has()
# can't test for a missing spec, so the Post CRD defaults spec to {}.
#
# Posts are written at Milo's platform root. visibility: AllContexts lets a
# query in any context find them as well as the caller's own documents; it's
# safe because every visible post is public, and hidden ones aren't indexed.
# See "Who can search posts" in README.md.
apiVersion: search.miloapis.com/v1alpha1
kind: ResourceIndexPolicy
metadata:
  name: feedback-posts
spec:
  targetResource:
    group: feedback.miloapis.com
    version: v1alpha1
    kind: Post
  visibility: AllContexts
  conditions:
    - name: visible
      expression: "!has(spec.hidden) || !spec.hidden"
  fields:
    - path: .metadata.name
    - path: .status.title
      searchable: true
    - path: .status.summary
      searchable: true
    - path: .status.bodyHTML
      searchable: true
    - path: .status.categories[*]
      searchable: true
    - path: .status.labels[*]
      searchable: true
    - path: .status.state
      searchable: true
    - path: .status.github.org
    - path: .status.github.repository
