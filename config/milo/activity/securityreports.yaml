# Security reports are logged at Metadata only: nothing about the
# vulnerability reaches the activity log.
apiVersion: activity.miloapis.com/v1alpha1
kind: ActivityPolicy
metadata:
  name: feedback.miloapis.com-securityreports
spec:
  resource:
    apiGroup: feedback.miloapis.com
    kind: SecurityReport
  auditRules:
    - name: report
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'create' && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} sent a security report"
    - name: update-status
      match: "!audit.user.username.startsWith('system:') && audit.verb in ['update', 'patch'] && has(audit.objectRef.subresource) && audit.objectRef.subresource == 'status' && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} updated security report {{ link(audit.objectRef.name, audit.objectRef) }}"
    - name: delete
      match: "!audit.user.username.startsWith('system:') && audit.verb == 'delete' && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} deleted security report {{ audit.objectRef.name }}"
