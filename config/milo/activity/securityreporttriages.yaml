# Triage notes are logged at Metadata only.
apiVersion: activity.miloapis.com/v1alpha1
kind: ActivityPolicy
metadata:
  name: feedback.miloapis.com-securityreporttriages
spec:
  resource:
    apiGroup: feedback.miloapis.com
    kind: SecurityReportTriage
  auditRules:
    - name: update
      match: "!audit.user.username.startsWith('system:') && audit.verb in ['update', 'patch'] && has(audit.responseStatus.code) && audit.responseStatus.code >= 200 && audit.responseStatus.code < 300 && !(has(audit.requestURI) && audit.requestURI.contains('dryRun='))"
      summary: "{{ actor }} updated the triage notes on security report {{ audit.objectRef.name }}"
