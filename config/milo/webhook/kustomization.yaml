# The admission webhooks Milo calls for feedback resources. manifests.yaml is
# generated by `task generate`; the patches point it at the operator's
# Service. Milo trusts certificates from the datum-control-plane issuer, so
# there is no caBundle.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - manifests.yaml

patches:
  - target:
      kind: MutatingWebhookConfiguration
      name: mutating-webhook-configuration
    patch: |-
      - op: replace
        path: /metadata/name
        value: feedback.miloapis.com
  - target:
      kind: MutatingWebhookConfiguration
    patch: |-
      - op: replace
        path: /webhooks/0/clientConfig/service/name
        value: feedback-operator-webhook
      - op: replace
        path: /webhooks/0/clientConfig/service/namespace
        value: feedback-system
      - op: replace
        path: /webhooks/1/clientConfig/service/name
        value: feedback-operator-webhook
      - op: replace
        path: /webhooks/1/clientConfig/service/namespace
        value: feedback-system
  - target:
      kind: ValidatingWebhookConfiguration
      name: validating-webhook-configuration
    patch: |-
      - op: replace
        path: /metadata/name
        value: feedback.miloapis.com
  - target:
      kind: ValidatingWebhookConfiguration
    patch: |-
      - op: replace
        path: /webhooks/0/clientConfig/service/name
        value: feedback-operator-webhook
      - op: replace
        path: /webhooks/0/clientConfig/service/namespace
        value: feedback-system
