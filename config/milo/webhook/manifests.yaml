---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: feedback-operator-webhook
      namespace: feedback-system
      path: /mutate-attachments
  failurePolicy: Fail
  name: attachments.feedback.miloapis.com
  rules:
  - apiGroups:
    - feedback.miloapis.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    resources:
    - submissions
    - securityreports
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: feedback-operator-webhook
      namespace: feedback-system
      path: /mutate-owner
  failurePolicy: Fail
  name: owner.feedback.miloapis.com
  rules:
  - apiGroups:
    - feedback.miloapis.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    resources:
    - votes
    - subscriptions
    - submissions
    - securityreports
    - feedbackprofiles
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: feedback-operator-webhook
      namespace: feedback-system
      path: /mutate-submissionreview
  failurePolicy: Fail
  name: reviewer.feedback.miloapis.com
  rules:
  - apiGroups:
    - feedback.miloapis.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - submissionreviews
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: feedback-operator-webhook
      namespace: feedback-system
      path: /validate-submission
  failurePolicy: Fail
  name: submission.feedback.miloapis.com
  rules:
  - apiGroups:
    - feedback.miloapis.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    resources:
    - submissions
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: feedback-operator-webhook
      namespace: feedback-system
      path: /validate-submissionreview
  failurePolicy: Fail
  name: submissionreview.feedback.miloapis.com
  rules:
  - apiGroups:
    - feedback.miloapis.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - submissionreviews
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: feedback-operator-webhook
      namespace: feedback-system
      path: /validate-vote
  failurePolicy: Fail
  name: vote.feedback.miloapis.com
  rules:
  - apiGroups:
    - feedback.miloapis.com
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    resources:
    - votes
    - subscriptions
  sideEffects: None
