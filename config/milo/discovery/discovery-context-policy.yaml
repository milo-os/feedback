apiVersion: discovery.miloapis.com/v1alpha1
kind: DiscoveryContextPolicy
metadata:
  name: feedback-service
spec:
  rules:
    # What a signed-in user works with in their own context: browsing and
    # voting, following, and sending feedback and security reports.
    - group: feedback.miloapis.com
      resources:
        - posts
        - postqueries
        - releases
        - changelogentries
        - votes
        - subscriptions
        - attachmentuploads
        - submissions
        - securityreports
        - securityacknowledgements
      contexts:
        - Platform
        - User
    # Staff configuration.
    - group: feedback.miloapis.com
      resources:
        - feedbacksources
      contexts:
        - Platform
